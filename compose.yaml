services:
  outreach-db:
    build:
      context: .
    image: outreach-db:latest
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      API_ORIGIN: http://127.0.0.1:8000
      JWT_PRIVATE_KEY_PATH: /app/conf/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/conf/jwt_public.pem
    volumes:
      - outreach-data:/app/conf

  caddy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./data/db/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - outreach-db

volumes:
  outreach-data:
  caddy-data:
  caddy-config:
